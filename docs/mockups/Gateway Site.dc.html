<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<div data-theme="{{ theme }}" data-accent="{{ accent }}" data-density="{{ density }}" class="min-h-screen bg-bg text-fg font-sans">
  <dc-import name="SiteHeader" theme="{{ theme }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,72px"></dc-import>
  <a id="top"></a>
  <dc-import name="HeroSection" hint-size="100%,640px"></dc-import>
  <dc-import name="ProofStrip" hint-size="100%,56px"></dc-import>
  <dc-import name="FeaturesSection" hint-size="100%,720px"></dc-import>
  <dc-import name="CratesSection" hint-size="100%,560px"></dc-import>
  <dc-import name="UsageSection" hint-size="100%,660px"></dc-import>
  <dc-import name="ArchitectureSection" hint-size="100%,660px"></dc-import>
  <dc-import name="ConsumersSection" hint-size="100%,480px"></dc-import>
  <dc-import name="VersioningSection" theme="{{ theme }}" hint-size="100%,480px"></dc-import>
  <dc-import name="CtaSection" hint-size="100%,480px"></dc-import>
  <dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;blue&quot;,&quot;options&quot;:[&quot;blue&quot;,&quot;violet&quot;,&quot;teal&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;default&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { theme: null };
  componentDidMount() {
    try { const t = localStorage.getItem('gw-theme'); if (t) this.setState({ theme: t }); } catch (e) {}
  }
  renderVals() {
    const p = this.props || {};
    const theme = this.state.theme || p.theme || 'light';
    return {
      theme,
      accent: p.accent || 'blue',
      density: p.density || 'default',
      toggleTheme: () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('gw-theme', next); } catch (e) {}
        this.setState({ theme: next });
      }
    };
  }
}
</script>
</body>
</html>
