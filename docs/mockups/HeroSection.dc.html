<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<section class="shell py-section flex flex-col items-center text-center">
  <div class="chip-accent gap-2 text-caption font-semibold">
    <span class="font-mono">{{ badgeMono }}</span>
    <span class="text-accent-line">&#183;</span>
    <span>{{ badge }}</span>
  </div>
  <h1 class="h1 mt-6 max-w-hero">{{ title }}</h1>
  <p class="lede mt-6 max-w-lede">{{ body }}</p>
  <div class="flex flex-wrap items-center justify-center gap-3 mt-8">
    <dc-import name="Button" href="{{ primaryHref }}" label="{{ primaryLabel }}" variant="primary" size="md" arrow="{{ true }}" hint-size="220px,48px"></dc-import>
    <dc-import name="Button" href="{{ secondaryHref }}" label="{{ secondaryLabel }}" variant="secondary" size="md" hint-size="190px,48px"></dc-import>
  </div>
  <div class="w-full max-w-3xl mt-10 text-left">
    <dc-import name="CodeFrame" filename="{{ filename }}" code="{{ install }}" copyable="{{ true }}" hint-size="100%,220px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const h = this.content().hero || {};
    return {
      badgeMono: h.badgeMono || '', badge: h.badge || '',
      title: h.title || '', body: h.body || '',
      primaryHref: (h.primary || {}).href, primaryLabel: (h.primary || {}).label,
      secondaryHref: (h.secondary || {}).href, secondaryLabel: (h.secondary || {}).label,
      filename: h.filename || 'Cargo.toml', install: h.install || ''
    };
  }
}
</script>
</body>
</html>
