<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<header class="sticky top-0 z-20 bg-nav backdrop-blur-md border-b border-line-hair">
  <div class="shell flex items-center justify-between gap-6 py-4">
    <a href="#top" class="flex items-center gap-3">
      <span class="w-7 h-7 rounded-control-sm bg-action text-on-action shadow-brand font-mono font-semibold text-body flex items-center justify-center">{{ mark }}</span>
      <span class="font-display font-semibold text-title tracking-brand">{{ brand }}</span>
    </a>
    <nav class="flex items-center gap-7 lt-lg:gap-5">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="5">
        <a href="{{ link.href }}" class="nav-link lt-md:hidden">{{ link.label }}</a>
      </sc-for>
      <button onClick="{{ toggleTheme }}" class="icon-btn" aria-label="Toggle colour theme" title="Toggle colour theme">{{ themeIcon }}</button>
      <dc-import name="Button" href="{{ ctaHref }}" label="{{ ctaLabel }}" variant="primary" size="sm" arrow="{{ true }}" hint-size="150px,40px"></dc-import>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1140,&quot;height&quot;:72},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;onToggleTheme&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() => void&quot;}}">
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const p = this.props || {};
    const nav = this.content().nav || { links: [], cta: {} };
    const isDark = (p.theme || 'light') === 'dark';
    const R = React.createElement;
    const themeIcon = isDark
      ? R('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'currentColor' },
          R('path', { d: 'M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z' }))
      : R('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round' },
          R('circle', { key: 'c', cx: 12, cy: 12, r: 4 }),
          R('line', { key: 'a', x1: 12, y1: 2.5, x2: 12, y2: 4.5 }),
          R('line', { key: 'b', x1: 12, y1: 19.5, x2: 12, y2: 21.5 }),
          R('line', { key: 'd', x1: 2.5, y1: 12, x2: 4.5, y2: 12 }),
          R('line', { key: 'e', x1: 19.5, y1: 12, x2: 21.5, y2: 12 }),
          R('line', { key: 'f', x1: 5.2, y1: 5.2, x2: 6.6, y2: 6.6 }),
          R('line', { key: 'g', x1: 17.4, y1: 17.4, x2: 18.8, y2: 18.8 }),
          R('line', { key: 'h', x1: 5.2, y1: 18.8, x2: 6.6, y2: 17.4 }),
          R('line', { key: 'i', x1: 17.4, y1: 6.6, x2: 18.8, y2: 5.2 }));
    return {
      mark: nav.mark || 'g',
      brand: nav.brand || 'gateway',
      links: nav.links || [],
      ctaHref: (nav.cta || {}).href || '#start',
      ctaLabel: (nav.cta || {}).label || 'Get started',
      themeIcon,
      toggleTheme: p.onToggleTheme || (() => {})
    };
  }
}
</script>
</body>
</html>
