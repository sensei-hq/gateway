<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<section class="band">
  <div class="shell py-section">
    <dc-import name="SectionHead" eyebrow="{{ eyebrow }}" title="{{ title }}" hint-size="100%,110px"></dc-import>
    <div ref="{{ hostRef }}" class="w-full min-h-75 mt-6"></div>
    <p class="meta mt-4 text-center">{{ caption }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  hostRef = React.createRef();
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  componentDidUpdate() { this.draw(); }
  draw() {
    const d3 = window.d3;
    const el = this.hostRef.current;
    const a = this.content().architecture;
    if (!el || !a) return;
    if (!d3) { clearTimeout(this.__dt); this.__dt = setTimeout(() => this.draw(), 120); return; }
    if (this.__drawn) return;
    this.__drawn = true;

    /* token names, not colours - these resolve per theme through the config preflight */
    const T = {
      fg: 'var(--c-fg)', muted: 'var(--c-muted)', faint: 'var(--c-faint)',
      accent: 'var(--c-accent)', accentWash: 'var(--c-accent-wash)', accentLine: 'var(--c-accent-line)',
      surface: 'var(--c-surface)', line: 'var(--c-line)', lineStrong: 'var(--c-line-strong)', chip: 'var(--c-chip)'
    };
    const SG = "'Space Grotesk',sans-serif";
    const MONO = "'JetBrains Mono',monospace";
    d3.select(el).selectAll('*').remove();
    const svg = d3.select(el).append('svg')
      .attr('class', 'w-full h-auto overflow-visible')
      .attr('viewBox', '0 0 1080 440')
      .attr('preserveAspectRatio', 'xMidYMid meet');

    const mk = svg.append('defs').append('marker').attr('id', 'gw-arw').attr('viewBox', '0 0 8 8')
      .attr('refX', 6.4).attr('refY', 4).attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto-start-reverse');
    mk.append('path').attr('d', 'M0.5,0.5 L7.5,4 L0.5,7.5 Z').style('fill', T.faint);

    const linkG = svg.append('g');
    const curve = (x1, y1, x2, y2) => { const mx = (x1 + x2) / 2; return 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2; };
    [[172, 220, 246, 220], [582, 220, 636, 220], [772, 212, 826, 146], [772, 228, 826, 309]].forEach(l => {
      const d = curve(l[0], l[1], l[2], l[3]);
      linkG.append('path').attr('d', d).style('fill', 'none').style('stroke', T.lineStrong).style('stroke-width', 1.75).style('stroke-linecap', 'round').attr('marker-end', 'url(#gw-arw)');
      linkG.append('path').attr('d', d).style('fill', 'none').style('stroke', T.accent).style('stroke-width', 2)
        .style('stroke-linecap', 'round').style('stroke-dasharray', '0.5 13').style('opacity', 0.5).style('animation', 'gw-flow 1.5s linear infinite');
    });

    const cardRect = (g, x, y, w, h, accent) => g.append('rect').attr('x', x).attr('y', y).attr('width', w).attr('height', h).attr('rx', 16)
      .style('fill', accent ? T.accentWash : T.surface).style('stroke', accent ? T.accentLine : T.line).style('stroke-width', 1);
    const txt = (g, x, y, str, o) => {
      o = o || {};
      g.append('text').attr('x', x).attr('y', y).text(str)
        .style('font-family', o.mono ? MONO : SG).style('font-size', (o.size || 14) + 'px')
        .style('font-weight', o.weight || 600).style('fill', o.fill || T.fg)
        .style('text-anchor', o.anchor || 'start').style('letter-spacing', o.mono ? '0' : '-.01em');
    };
    const pills = (g, labels, x0, y0, maxX) => {
      let x = x0, y = y0; const h = 24, pad = 9, gap = 7;
      labels.forEach(l => {
        const w = Math.round(l.length * 6.7) + pad * 2;
        if (x + w > maxX) { x = x0; y += h + 7; }
        g.append('rect').attr('x', x).attr('y', y).attr('width', w).attr('height', h).attr('rx', 7).style('fill', T.chip);
        g.append('text').attr('x', x + pad).attr('y', y + 16).text(l).style('font-family', MONO).style('font-size', '11.5px').style('fill', T.muted);
        x += w + gap;
      });
    };

    const app = svg.append('g');
    cardRect(app, 20, 170, 150, 100, false);
    txt(app, 95, 212, a.app.title, { size: 17, anchor: 'middle' });
    txt(app, 95, 236, a.app.sub, { mono: true, size: 12, weight: 500, fill: T.faint, anchor: 'middle' });

    const gw = svg.append('g');
    cardRect(gw, 250, 66, 330, 308, true);
    gw.append('circle').attr('cx', 300).attr('cy', 103).attr('r', 5).style('fill', T.accent);
    txt(gw, 315, 110, a.engine.title, { size: 23 });
    txt(gw, 315, 132, a.engine.sub, { mono: true, size: 12, weight: 500, fill: T.accent });
    gw.append('line').attr('x1', 274).attr('y1', 152).attr('x2', 556).attr('y2', 152).style('stroke', T.accentLine).style('stroke-width', 1);
    const capW = 262, capX = 284, capH = 27, capGap = 8, capY0 = 166;
    a.engine.caps.forEach((c, i) => {
      const y = capY0 + i * (capH + capGap);
      gw.append('rect').attr('x', capX).attr('y', y).attr('width', capW).attr('height', capH).attr('rx', 9).style('fill', T.surface).style('stroke', T.line).style('stroke-width', 1);
      gw.append('circle').attr('cx', capX + 16).attr('cy', y + capH / 2).attr('r', 3.5).style('fill', T.accent);
      txt(gw, capX + 30, y + capH / 2 + 4, c, { mono: true, size: 12, weight: 500, fill: T.muted });
    });
    gw.append('line').attr('x1', 274).attr('y1', 313).attr('x2', 556).attr('y2', 313).style('stroke', T.accentLine).style('stroke-width', 1);
    a.engine.notes.forEach((n, i) => txt(gw, 415, 334 + i * 19, n, { mono: true, size: 11, weight: 400, fill: T.faint, anchor: 'middle' }));

    const ad = svg.append('g');
    cardRect(ad, 640, 160, 130, 120, false);
    txt(ad, 705, 205, a.adapter.line1, { size: 15, anchor: 'middle' });
    txt(ad, 705, 225, a.adapter.line2, { size: 15, anchor: 'middle' });
    txt(ad, 705, 248, a.adapter.sub, { mono: true, size: 11.5, weight: 500, fill: T.accent, anchor: 'middle' });

    const cl = svg.append('g');
    cardRect(cl, 830, 70, 230, 150, false);
    txt(cl, 852, 104, a.cloud.title, { size: 15 });
    txt(cl, 852, 124, a.cloud.sub, { mono: true, size: 11.5, weight: 500, fill: T.accent });
    pills(cl, a.cloud.pills, 852, 140, 1044);

    const lo = svg.append('g');
    cardRect(lo, 830, 250, 230, 120, false);
    txt(lo, 852, 284, a.local.title, { size: 15 });
    txt(lo, 852, 304, a.local.sub, { mono: true, size: 11.5, weight: 500, fill: T.accent });
    pills(lo, a.local.pills, 852, 320, 1044);
  }
  renderVals() {
    const a = this.content().architecture || {};
    return { eyebrow: a.eyebrow || '', title: a.title || '', caption: a.caption || '', hostRef: this.hostRef };
  }
}
</script>
</body>
</html>
