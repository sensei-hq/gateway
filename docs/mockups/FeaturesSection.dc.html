<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<section id="features" class="shell py-section">
  <dc-import name="SectionHead" eyebrow="{{ eyebrow }}" title="{{ title }}" body="{{ body }}" mono="{{ mono }}" hint-size="100%,190px"></dc-import>
  <div class="grid grid-cols-3 gap-5 mt-10 lt-lg:grid-cols-2 lt-sm:grid-cols-1">
    <sc-for list="{{ items }}" as="f" hint-placeholder-count="6">
      <dc-import name="InfoCard" tag="{{ f.tag }}" title="{{ f.title }}" body="{{ f.body }}" hint-size="100%,200px"></dc-import>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const f = this.content().features || {};
    return { eyebrow: f.eyebrow || '', title: f.title || '', body: f.body || '', mono: f.mono || '', items: f.items || [] };
  }
}
</script>
</body>
</html>
