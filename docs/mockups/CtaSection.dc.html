<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<section id="start" class="shell py-section flex flex-col items-center text-center">
  <h2 class="font-display font-semibold text-hero tracking-display max-w-cta lt-md:text-head">{{ title }}</h2>
  <p class="lede mt-5 max-w-short">{{ body }}</p>
  <div class="flex flex-wrap items-center justify-center gap-3 mt-8">
    <dc-import name="Button" href="{{ primaryHref }}" label="{{ primaryLabel }}" variant="primary" size="lg" arrow="{{ true }}" hint-size="230px,52px"></dc-import>
    <dc-import name="Button" href="{{ secondaryHref }}" label="{{ secondaryLabel }}" variant="secondary" size="lg" hint-size="190px,52px"></dc-import>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const c = this.content().cta || {};
    return {
      title: c.title || '', body: c.body || '',
      primaryHref: (c.primary || {}).href, primaryLabel: (c.primary || {}).label,
      secondaryHref: (c.secondary || {}).href, secondaryLabel: (c.secondary || {}).label
    };
  }
}
</script>
</body>
</html>
