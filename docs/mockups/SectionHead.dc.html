<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<div class="{{ wrapCls }}">
  <dc-import name="Eyebrow" label="{{ eyebrow }}" hint-size="180px,18px"></dc-import>
  <h2 class="h2 mt-4">{{ title }}</h2>
  <sc-if value="{{ hasBody }}"><p class="lede mt-4">{{ body }}</p></sc-if>
  <sc-if value="{{ hasMono }}"><p class="meta mt-3">{{ mono }}</p></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:200},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The routing engine&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Everything a request needs.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;start&quot;,&quot;options&quot;:[&quot;start&quot;,&quot;center&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;measure&quot;,&quot;options&quot;:[&quot;measure&quot;,&quot;lede&quot;,&quot;full&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const width = { measure: 'max-w-measure', lede: 'max-w-lede', full: '' }[p.width] || 'max-w-measure';
    const align = p.align === 'center' ? ' mx-auto text-center' : '';
    return {
      eyebrow: p.eyebrow || '', title: p.title || '',
      body: p.body || '', mono: p.mono || '',
      hasBody: !!p.body, hasMono: !!p.mono,
      wrapCls: (width + align).trim()
    };
  }
}
</script>
</body>
</html>
