<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<a href="{{ href }}" class="{{ cls }}">{{ label }}<sc-if value="{{ arrow }}"><span class="font-mono opacity-65" aria-hidden="true">&#8594;</span></sc-if></a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:56},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Get started&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;primary&quot;,&quot;options&quot;:[&quot;primary&quot;,&quot;secondary&quot;,&quot;ghost&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;md&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;,&quot;lg&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;arrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const variant = { primary: 'btn-primary', secondary: 'btn-secondary', ghost: 'btn-ghost' }[p.variant] || 'btn-primary';
    const size = { sm: 'btn-sm', md: 'btn-md', lg: 'btn-lg' }[p.size] || 'btn-md';
    return { href: p.href || '#', label: p.label || 'Button', arrow: !!p.arrow, cls: variant + ' ' + size };
  }
}
</script>
</body>
</html>
