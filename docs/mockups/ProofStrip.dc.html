<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<div class="band">
  <div class="shell flex flex-wrap items-center gap-6 py-4 font-mono text-caption text-faint">
    <span class="text-muted font-medium">{{ label }}</span>
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="8">
      <span>{{ item }}</span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const p = this.content().proof || {};
    return { label: p.label || '', items: p.items || [] };
  }
}
</script>
</body>
</html>
