<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="./fonts.css">
<script src="./content.js"></script>
<script src="./uno.config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
</helmet>
<section id="versioning" data-theme="{{ invTheme }}" class="bg-bg text-fg">
  <div class="shell py-section grid grid-cols-2 gap-10 items-center lt-md:grid-cols-1">
    <dc-import name="SectionHead" eyebrow="{{ eyebrow }}" title="{{ title }}" body="{{ body }}" width="full" hint-size="100%,200px"></dc-import>
    <div class="flex flex-col gap-3">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
        <div class="card rounded-control flex items-start gap-3 px-5 py-4">
          <span class="font-mono text-caption text-accent">{{ s.n }}</span>
          <span class="flex flex-col gap-1">
            <span class="h4">{{ s.title }}</span>
            <span class="meta">{{ s.note }}</span>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  content() { return (typeof window !== 'undefined' && window.__GATEWAY_CONTENT) || {}; }
  componentDidMount() { this.awaitContent(); }
  awaitContent() {
    if (typeof window === 'undefined' || window.__GATEWAY_CONTENT) return;
    clearTimeout(this.__ct);
    this.__ct = setTimeout(() => { this.awaitContent(); this.forceUpdate(); }, 100);
  }
  renderVals() {
    const v = this.content().versioning || {};
    const theme = (this.props || {}).theme || 'light';
    return {
      invTheme: theme === 'dark' ? 'light' : 'dark',
      eyebrow: v.eyebrow || '', title: v.title || '', body: v.body || '', steps: v.steps || []
    };
  }
}
</script>
</body>
</html>
