[package]
name = "sensei-torii"
version = "0.1.0"
edition = "2024"
description = "torii: the operator control plane for the sensei orchestrator"
license = "MIT"

# lib+bin: the binary is only clap + `dispatch`; the command implementations live in the
# library so an integration test can drive the real `cmd::worker::serve` (and the real
# `cmd::config::push`) rather than a re-implementation of their contracts.
[lib]
name = "torii"
path = "src/lib.rs"

[[bin]]
name = "torii"
path = "src/main.rs"

[dependencies]
orchestrator-core = { package = "sensei-orchestrator-core", path = "../orchestrator-core" }
orchestrator = { package = "sensei-orchestrator", path = "../orchestrator" }
orchestrator-store = { package = "sensei-orchestrator-store", path = "../orchestrator-store", features = ["postgres"] }
gateway = { package = "sensei-gateway", path = "../gateway" }
kernel = { package = "sensei-kernel", path = "../kernel" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# `test-support` on top of the plain `postgres` dependency above: it exposes
# `orchestrator_store::test_guard`, the ONE DB-test isolation guard, which this crate's
# tests take instead of the private copy they used to carry. Dev-only — the binary links
# the un-featured dependency.
orchestrator-store = { package = "sensei-orchestrator-store", path = "../orchestrator-store", features = ["postgres", "test-support"] }
# The cross-process e2e needs the same gateway/clock doubles the executor's own tests
# use (a gated gateway to force a durable pause, a recording one to count re-spend).
orchestrator = { package = "sensei-orchestrator", path = "../orchestrator", features = ["test-support"] }
