[package]
name = "sensei-vault"
version = "0.4.6"
edition = "2024"
description = "Shared BYOK credential vault (AES-256-GCM envelope, KEK/DEK, tenant‖router AAD binding) for sensei + strategos"
license = "MIT"

[lib]
name = "vault"

[features]
# The Postgres `VaultStore` adapter + Supabase-Vault `KekProvider`. Off by default so the
# core crate stays dependency-light; strategos/sensei enable it.
sqlx = ["dep:sqlx"]

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
base64 = "0.22"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
