# decision-bench example config. Copy to bench.toml (gitignored) and edit.
#
# Starting each server (verified on this machine):
#
#   Laya, one server for english / multilingual / typed-decisions / ane.
#   venv at /tmp/laya-bench/env, installed with
#   `pip install "laya-coreml[serve]==0.5.1"`. Port 8765 is taken here, so 8766:
#     LAYA_HOST=127.0.0.1 LAYA_PORT=8766 \
#     LAYA_MODELS=english,multilingual,typed-decisions \
#     LAYA_EXTRA_MODELS='{"ane":"aac6fef/laya-multilingual-coreml-ane"}' \
#     /tmp/laya-bench/env/.venv/bin/laya-coreml-serve
#
#   Ollama (>= 0.35; pull the model once with `ollama pull nimble`):
#     ollama serve
#
#   llama.cpp b11381:
#     ~/opt/llamacpp-systemone/bin-b11381/llama-b11381/llama-server \
#       -m ~/opt/llamacpp-systemone/models/Bespoke-Nimble-9B-v3-Q4_K_M.gguf \
#       --alias nimble-v3 --port 8091 -c 8192

[[models]]
id = "laya-english"
router = "laya"
url = "http://127.0.0.1:8766"
api_model_id = "english"
context_window = 512

[[models]]
id = "laya-multilingual"
router = "laya"
url = "http://127.0.0.1:8766"
api_model_id = "multilingual"
context_window = 1024

[[models]]
id = "laya-typed"
router = "laya"
url = "http://127.0.0.1:8766"
api_model_id = "typed-decisions"
context_window = 1024

[[models]]
id = "laya-ane"
router = "laya"
url = "http://127.0.0.1:8766"
api_model_id = "ane"
context_window = 96

[[models]]
id = "nimble"
router = "ollama"
url = "http://127.0.0.1:11434"
api_model_id = "nimble"
context_window = 8192

[[models]]
id = "nimble-v3"
router = "llamacpp"
url = "http://127.0.0.1:8091"
api_model_id = "nimble-v3"
context_window = 8192
