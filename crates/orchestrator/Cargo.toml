[package]
name = "sensei-orchestrator"
version = "0.1.0"
edition = "2024"
description = "The sensei orchestrator: a deterministic executor over a durable journal, wired to the gateway"
license = "MIT"

[lib]
name = "orchestrator"

[features]
# Docker-Postgres-only e2e (cross-process durable resume + durable in-doubt reconcile).
# OFF by default so the default build/test stays byte-identical and DB-free; enables the
# store crate's Postgres adapters for the `#[cfg(feature = "postgres-tests")]` tests, which
# reach Postgres only through `orchestrator_store::postgres::{connect, PostgresJournal,
# PostgresContentStore}` (no direct sqlx handle).
postgres-tests = ["orchestrator-store/postgres", "orchestrator-store/test-support"]
# Exposes the gateway/clock test doubles (`recording_gateway`, `timeout_gateway`,
# `FakeClock`, ...) to OTHER crates' dev-dependencies. Dev-only: nothing in a production
# build enables it, and with it off `test_support` stays `#[cfg(test)]`-private as before.
test-support = []

[dependencies]
orchestrator-core = { package = "sensei-orchestrator-core", path = "../orchestrator-core" }
gateway = { package = "sensei-gateway", path = "../gateway" }
kernel = { package = "sensei-kernel", path = "../kernel" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
nix = { version = "0.29", features = ["resource", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# SP-4 Linux sandbox backend: landlock (fs-write confinement) + seccomp (egress deny). These are
# Linux-only and target-gated, so they are NOT pulled into the macOS build.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"

[dev-dependencies]
orchestrator-store = { package = "sensei-orchestrator-store", path = "../orchestrator-store" }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
