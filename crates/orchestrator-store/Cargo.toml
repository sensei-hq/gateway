[package]
name = "sensei-orchestrator-store"
version = "0.9.0"
edition = "2024"
description = "In-memory stores and the registry-directory reader for the sensei orchestrator (persistence lives in torii)"
license = "MIT"

[lib]
name = "orchestrator_store"

[dependencies]
orchestrator-core = { package = "sensei-orchestrator-core", path = "../orchestrator-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
orchestrator-testkit = { package = "sensei-orchestrator-testkit", path = "../orchestrator-testkit" }
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
