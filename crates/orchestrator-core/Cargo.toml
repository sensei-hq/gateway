[package]
name = "sensei-orchestrator-core"
version = "0.1.0"
edition = "2024"
description = "Zero-I/O core types for the sensei orchestrator: graph, effect, and journal vocabulary"
license = "MIT"

[lib]
name = "orchestrator_core"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
