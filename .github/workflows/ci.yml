name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN for every job: they only read the repo (checkout
# + build/test/coverage). The coverage upload authenticates to Qlty with
# QLTY_COVERAGE_TOKEN, not GITHUB_TOKEN, so no write scopes are needed.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Third-party actions are pinned to full commit SHAs (not mutable tags) to
# prevent supply-chain repointing. The trailing comment records the human tag.
jobs:
  test:
    name: build · test
    runs-on: ubuntu-latest

    # A REAL Postgres, because the alternative is a green tick that proves nothing.
    # Until the `have_database_url` gating landed, 48 DB tests early-returned when
    # `DATABASE_URL` was unset and libtest counted every one of them as PASSED — so
    # CI reported them green having never opened a connection. Gating made the skip
    # honest (they report `ignored`); this service makes them RUN.
    #
    # Pinned by digest, not the mutable `:16` tag, for the same supply-chain reason
    # the actions below are pinned to commit SHAs. Digest is for postgres:16.
    # `--health-cmd pg_isready` makes the runner block until the server accepts
    # connections, so no step needs to sleep-and-hope.
    services:
      postgres:
        image: postgres@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Setting this is what flips the 48 tests from `ignored` to running: each
      # package's build.rs emits `cargo::rustc-cfg=have_database_url` when it is
      # present. A throwaway CI database — never a shared or production one.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't persist GITHUB_TOKEN in .git/config — no job pushes or does
          # authenticated git ops after checkout (coverage uploads via
          # QLTY_COVERAGE_TOKEN). Resolves zizmor:artipacked; defense-in-depth
          # on top of the least-privilege `permissions: contents: read` above.
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # `--locked` is usable now that Cargo.lock is committed (#56): it fails the job if
      # the lockfile and the manifests disagree, so CI builds exactly what a developer
      # resolved rather than silently re-resolving to something newer.
      - name: Build
        run: cargo build --workspace --locked

      # The schema the DB tests expect. dbd owns `database/`; `_apply_all.sql` is
      # its generated all-in-one apply, and every statement is `create ... if not
      # exists`, so this is idempotent. ON_ERROR_STOP makes a bad statement fail the
      # job instead of leaving a half-built schema for the tests to trip over.
      - name: Apply database schema
        run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f database/_apply_all.sql

      # `--features postgres-tests` / `--features postgres` are NOT enabled by the
      # plain workspace run, so the orchestrator and store PG suites need their own
      # invocations. Without these the service container would be started and then
      # largely unused.
      - name: Test
        run: cargo test --workspace --locked

      - name: Test (Postgres-backed suites)
        run: |
          cargo test -p sensei-orchestrator --features postgres-tests --locked
          cargo test -p sensei-orchestrator-store --features postgres --locked

  # Gates that were previously enforced ONLY by the local pre-commit hook, so they held
  # exactly as long as every contributor ran it (#56). A separate job from `test` so a
  # formatting failure and a test failure are distinguishable at a glance, and so this
  # reports in seconds without waiting on the Postgres service.
  #
  # The note this replaces said fmt and clippy were "intentionally omitted for now —
  # the pre-existing tree is not yet rustfmt-formatted or clippy-clean". That has not
  # been true for some time: both gates are clean at HEAD and the pre-commit hook has
  # been running them on every commit.
  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all --check

      # `--all-targets` so tests and benches are linted too, not just the lib/bin
      # targets — most of this workspace's code by volume lives in `#[cfg(test)]`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Audits the committed Cargo.lock against the RustSec advisory database (#56). This
  # could not run at all before the lockfile was committed — `cargo audit` audits a
  # lockfile. Documented exceptions live in `.cargo/audit.toml`, which carries the
  # reachability argument and a retire condition for each.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-audit
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit

  # `site/` had no job at all (#56) — no install, no type-check, no test, no build. The
  # failure that motivates this is concrete: the same gap in `sensei-hq/dbd` let
  # `bun run check` sit COMPLETELY broken for an unknown period, because svelte-check
  # was aborting before doing any work and nothing ran it.
  #
  # `--frozen-lockfile` is the real gate here, not just reproducibility: it fails when
  # bun.lock and package.json disagree, which is exactly how a stale transitive survives
  # while the declared range already allows the fix.
  #
  # Not overridden, deliberately: `cookie`. @sveltejs/kit (through 2.70.3, the latest)
  # declares `^0.6.0` and resolves 0.6.0, which carries GHSA-pxg6-pf52-xh8x (LOW), while
  # `youch` needs `^1.0.2` and resolves 1.1.1. Bun ignores NESTED overrides, so a single
  # flat value must serve both parents: forcing `^0.7.2` patches kit but drags youch
  # below its own floor and breaks the dev error overlay, and forcing `1.x` breaks kit
  # outright (1.0 returns a null-prototype object from `parse` and delegates
  # quote-parsing to `decode`, and kit calls `parse(header, { decode: v => v })`).
  # Trading a working dev surface for a LOW advisory on a static docs site is a bad
  # trade. Retire when kit moves to `cookie ^0.7`.
  site:
    name: site (check · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run test` is vitest in BROWSER mode — `vite.config.ts` configures
      # `@vitest/browser-playwright` with a headless chromium instance — so the runner
      # needs a real browser binary. Without this the suite fails at launch with
      # "Executable doesn't exist at .../chrome-headless-shell". Only chromium is
      # installed because that is the single configured instance; `--with-deps` pulls
      # the shared libraries the headless shell links against on a bare runner.
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  coverage:
    name: coverage (gateway >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Don't persist GITHUB_TOKEN in .git/config — no job pushes or does
          # authenticated git ops after checkout (coverage uploads via
          # QLTY_COVERAGE_TOKEN). Resolves zizmor:artipacked; defense-in-depth
          # on top of the least-privilege `permissions: contents: read` above.
          persist-credentials: false

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9458fed45835344deb5e69e06e831be047c96abf # cargo-llvm-cov

      - name: Coverage (lcov + fail under 80% lines)
        # Writes the lcov report *before* evaluating the threshold, so the file
        # exists for the upload step even when the gate trips.
        run: cargo llvm-cov -p sensei-gateway --lcov --output-path target/lcov.info --fail-under-lines 80

      - name: Upload coverage to Qlty
        # `if: always()` so the coverage number still reports to Qlty even when
        # the 80%-line gate above fails. Pinned to the v2 commit SHA per the
        # supply-chain policy noted above.
        if: always()
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: target/lcov.info
